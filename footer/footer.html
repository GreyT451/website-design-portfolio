<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footer — Shreyas Gharat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@200;300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { display: block; width: 100%; height: auto; font-size: 16px; }
    footer { display: block; width: 100%; }

    :root {
      --accent:  #E8341A;
      --sans:    'Barlow', sans-serif;
      --mono:    'DM Mono', monospace;
      --max:     1320px;
    }

    body { background: #000; }

    /* ── FOOTER ─────────────────────────────────────────────── */
    footer {
      background: #000;
      color: #ECEAE5;
      position: relative;
    }

    /* Top strip */
    .footer-strip { border-bottom: 1px solid #191919; }
    .footer-strip-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 26px 28px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .footer-touch {
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }
    .footer-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.42);
    }
    .footer-badge .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 7px var(--accent);
      animation: ring 2.2s ease-in-out infinite;
    }
    @keyframes ring {
      0%   { box-shadow: 0 0 0 0 rgba(232,52,26,0.55); }
      60%  { box-shadow: 0 0 0 6px rgba(232,52,26,0); }
      100% { box-shadow: 0 0 0 0 rgba(232,52,26,0); }
    }

    /* Email */
    .footer-email-wrap { border-bottom: 1px solid #191919; }
    .footer-email-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 36px 28px;
    }
    .footer-email {
      font-family: var(--sans);
      font-size: clamp(16px, 4.5vw, 40px);
      font-weight: 300;
      letter-spacing: -0.02em;
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: baseline;
      gap: 0.2em;
      transition: color 0.2s;
    }
    .footer-email:hover { color: rgba(255,255,255,0.65); }
    .footer-email .email-arr {
      font-size: 1em;
      opacity: 0.5;
      transition: opacity 0.2s, transform 0.2s;
      line-height: 1;
    }
    .footer-email:hover .email-arr { opacity: 0.85; transform: translate(3px, -3px); }

    /* 4-col info grid */
    .footer-grid { border-bottom: 1px solid #191919; }
    .footer-grid-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 26px 28px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }
    .footer-col {
      border-right: 1px solid #191919;
      padding-right: 24px;
    }
    .footer-col:not(:first-child) { padding-left: 24px; }
    .footer-col:last-child { border-right: none; }

    .footer-col-label {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.22);
      margin-bottom: 8px;
    }
    .footer-col-val {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 300;
      color: rgba(255,255,255,0.55);
      line-height: 1.65;
    }
    .footer-col-val a {
      color: inherit;
      text-decoration: none;
      transition: color 0.18s;
    }
    .footer-col-val a:hover { color: rgba(255,255,255,0.9); }
    .footer-col:first-child .footer-col-val { white-space: nowrap; }

    /* Copyright */
    .footer-copy-wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 18px 28px;
      display: flex;
      justify-content: center;
    }
    .footer-copy {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.30);
    }

    @media (max-width: 600px) {
      .footer-grid-inner { grid-template-columns: 1fr 1fr; }
      .footer-col:nth-child(2) { border-right: none; }
      .footer-col:nth-child(3) { padding-left: 0; border-right: 1px solid #191919; }
    }

    @media (max-width: 400px) {
      .footer-grid-inner { grid-template-columns: 1fr; }
      .footer-col {
        border-right: none;
        border-bottom: 1px solid #191919;
        padding: 16px 0;
      }
      .footer-col:not(:first-child) { padding-left: 0; }
      .footer-col:last-child { border-bottom: none; }
      .footer-col:nth-child(3) { border-right: none; }
    }
  </style>
</head>
<body>

  <footer>
    <div class="footer-strip">
      <div class="footer-strip-inner">
        <span class="footer-touch">/ Get in touch</span>
        <span class="footer-badge">
          <span class="dot"></span>Open to work
        </span>
      </div>
    </div>

    <div class="footer-email-wrap">
      <div class="footer-email-inner">
        <a class="footer-email" href="mailto:shreyasgharat14@gmail.com">
          shreyasgharat14@gmail.com<span class="email-arr">↗</span>
        </a>
      </div>
    </div>

    <div class="footer-grid">
      <div class="footer-grid-inner">
        <div class="footer-col">
          <div class="footer-col-label">Phone / 01</div>
          <div class="footer-col-val">+1 (912) 441-6974</div>
        </div>
        <div class="footer-col">
          <div class="footer-col-label">Based / 02</div>
          <div class="footer-col-val">Savannah, GA, USA</div>
        </div>
        <div class="footer-col">
          <div class="footer-col-label">Social / 03</div>
          <div class="footer-col-val"><a href="https://www.linkedin.com/in/shreyas-gharat/" target="_blank" rel="noopener">LinkedIn ↗</a></div>
        </div>
        <div class="footer-col">
          <div class="footer-col-label">Documents / 04</div>
          <div class="footer-col-val">
            <a href="https://www.shreyasgharat.com/product-industrial-and-user-experience-designer" target="_top">About</a>&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;<a href="https://greyt451.github.io/website-design-portfolio/resume/ShreyasGharat_Resume.pdf" target="_blank" rel="noopener" style="text-decoration: underline; white-space: nowrap;">Résumé (PDF)</a>
          </div>
        </div>
      </div>
    </div>

    <div class="footer-copy-wrap">
      <p class="footer-copy">
        <span style="color: var(--accent);">©</span> 2026 — Shreyas Gharat. All Rights Reserved.
      </p>
    </div>
  </footer>

</body>
</html>
